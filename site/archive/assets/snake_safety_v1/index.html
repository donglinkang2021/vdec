<h1>snake-safety-v1：历史样本与标签</h1>
<p>本页包含 108 个局面、96 个同源题组（family）。同源题组指由同一来源构造的相关局面。标签仅供人工核验，不输入模型。</p>
<p>安全表示下一步不会碰撞。安全动作数为 0，表示无论选择哪个动作，下一步都会碰撞。</p>
